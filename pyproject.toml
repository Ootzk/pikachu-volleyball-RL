[project]
name = "pikachu-volleyball-rl"
version = "0.1.0"
description = "Train a Pikachu Volleyball AI with reinforcement learning and play against it in your browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pikazoo",
    "stable-baselines3",
    "torch",
    "gymnasium",
    "numpy",
    "pygame>=2.3.0",
    "moviepy>=1.0.0",
]

[tool.uv.sources]
pikazoo = { path = "training/env", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training", "training.*"]
